# State stories, first set (40 scenarios; the interchange test of Supp. F.5 trains and counts on 28 of them, 56
# stories; make_state_items.py builds the second set from this file). Each scenario has two versions: `happened` (the
# change takes place) and `cancelled` (it does not), so the right answer and the right intermediate picture flip. No
# story names the outcome; the question asks a property with two options. `outcome` and `start` are the two pictures
# the judges choose between (the changed thing, the unchanged thing).
template: "{story} {question} Answer with one word: {a} or {b}."
items:
  # --- heat and cold
  - {id: ice, family: heat, happened: "An ice cube was left on a sunny table for an hour.", cancelled: "An ice cube was kept in the freezer for an hour.",
